name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t telegram-msg-svc-auto:ci .
      - run: |
          out=$(docker run --rm -e TELEGRAM_BOT_TOKEN= telegram-msg-svc-auto:ci 2>&1 || true)
          echo "$out" | grep -q "TELEGRAM_BOT_TOKEN is not set"
