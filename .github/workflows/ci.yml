name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
      - run: |
          uv export --frozen --no-emit-project --no-emit-workspace -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t telegram-msg-svc-auto:ci .
      - run: |
          out=$(docker run --rm -e TELEGRAM_BOT_TOKEN= telegram-msg-svc-auto:ci 2>&1 || true)
          echo "$out" | grep -q "TELEGRAM_BOT_TOKEN is not set"
      - run: |
          if out=$(docker run --rm -e ANSWER_BOT_TOKEN=123:abc -e RENDER_EXTERNAL_URL=https://example.invalid telegram-msg-svc-auto:ci python -m tgforecast answer 2>&1); then
            echo "expected a non-zero exit"; exit 1
          fi
          echo "$out" | grep -q "WEBHOOK_SECRET is not set"
