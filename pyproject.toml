[project]
name = "telegram-msg-svc-auto"
version = "0.1.0"
description = "Daily weather forecast to a Telegram channel: caption plus a matplotlib chart"
requires-python = ">=3.12,<3.13"
dependencies = [
  "python-telegram-bot[job-queue,webhooks]>=22.8,<23",
  "matplotlib>=3.11,<4",
  "httpx>=0.28,<1",
  "tzdata>=2025.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "respx>=0.23",
  "ruff>=0.12",
  "invoke>=2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"
pythonpath = ["."]  # tgforecast is not installed (package = false)
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # ruff format owns line length; long string literals are allowed
